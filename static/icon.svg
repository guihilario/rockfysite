<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Rockfy">
  <!-- A barra mint é o mesmo path do logo (static/img/rockfy-logo.svg, .cls-1),
       reposicionado: translate leva o centro do bbox da barra à origem, o
       scale a ajusta ao quadrado. Copiar a geometria em vez de redesenhá-la
       garante que o ícone não vá divergindo da marca a cada retoque do logo.
       As cores são as do próprio arquivo: #202124 e #6fffce (--mint). -->
  <rect width="64" height="64" rx="14" fill="#202124"/>
  <g transform="translate(32 32) scale(1.58) translate(-126.155 -24.12)">
    <path d="M118.5,34.88l11.08-21.52h4.23l-11.08,21.52h-4.23Z" fill="#6fffce"/>
  </g>
</svg>
